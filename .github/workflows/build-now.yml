name: Build HybridMount Kernel Now (houji)
on:
  push:
    branches: [feat/hybridmount-vfs-6.1.138]
    paths: ['.github/workflows/build-now.yml']
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/main.yml
    with:
      release_type: CI
      use_cache: false
      kernel_build_version: 6.1.x-android14
      # 2025-06 = sublevel 138 = OS3.0.307.0 的 GKI 源码分支
      os_patch_level: "2025-06"
      # 保留 stock KMI generation 后缀（-android14-11-），与 system_dlkm 模块一致
      keep_kmi: true
      brand_name: icecream
      commit_mode: verified
      root_flavor: KernelSU
      use_susfs: true
      use_nomount: true
      use_bbg: true
      use_net: true
      use_ds: true
      use_ntsync: true
      use_ptrace: true
      use_unicode: true
      use_bpf: true
      use_perf: true
      test_release_notes: false
    secrets: inherit
